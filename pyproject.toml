[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nivelle-ai"
dynamic = ["version"]
requires-python = ">=3.12,<3.15"
dependencies = [
  "aiosqlite>=0.20", "fastapi>=0.115", "httpx>=0.27", "keyring>=25",
  "imageio-ffmpeg>=0.6", "numpy>=2.2", "platformdirs>=4", "psutil>=6",
  "pydantic>=2.9", "PySide6>=6.7", "PyYAML>=6", "qasync>=0.27", "uvicorn>=0.30",
  "websockets>=13"
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11", "pyinstaller==6.21.0", "pytest>=8", "pytest-asyncio>=0.24",
  "pytest-qt>=4.4", "ruff>=0.7"
]

[project.scripts]
nivelle-core = "nivelle_core.main:main"
nivelle-link = "nivelle_link.main:main"

[tool.hatch.build.targets.wheel]
packages = [
  "apps/server/nivelle_core", "apps/client/nivelle_link", "packages/nivelle_protocol",
  # Import shims retained only for in-place 0.3.1 upgrades.
  "apps/server/nozomi_server", "apps/client/nozomi_client", "packages/nozomi_protocol"
]

[tool.hatch.version]
path = "VERSION"
pattern = "^(?P<version>[0-9A-Za-z][0-9A-Za-z._+-]{0,63})$"

[tool.hatch.build.targets.wheel.force-include]
"VERSION" = "nivelle_protocol/VERSION"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "apps/server/nivelle_core/tests"]
pythonpath = ["apps/server", "apps/client", "packages"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["nivelle_protocol", "nivelle_core"]
mypy_path = ["packages", "apps/server"]
exclude = ["apps/server/nivelle_core/tests/"]

[[tool.mypy.overrides]]
module = ["yaml", "aiosqlite", "psutil"]
ignore_missing_imports = true
